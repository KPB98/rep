<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f6f1" />
  <title>Rep / Sprint</title>
  <style>
    :root { --ink:#1c2924; --muted:#718079; --line:#d9ded8; --paper:#f4f6f1; --white:#fff; --lime:#d8ff53; --green:#205d46; --green-2:#3b8060; --orange:#ffbc79; --ring-size:min(39vw, 168px); }
    * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input { font:inherit; } button { cursor:pointer; border:0; color:inherit; }
    .app { max-width:630px; margin:auto; min-height:100dvh; padding:28px 20px 105px; position:relative; overflow:hidden; }
    .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:35px; } .brand { font-weight:800; letter-spacing:-.07em; font-size:25px; } .brand i{ font-style:normal; color:var(--green-2); }
    .date-pill { border:1px solid var(--line); border-radius:99px; padding:8px 11px; color:var(--muted); font-size:12px; font-weight:650; background:rgba(255,255,255,.56); }
    .eyebrow { color:var(--green-2); text-transform:uppercase; font-size:10px; font-weight:800; letter-spacing:.12em; margin:0 0 7px; }
    h1 { font-size:clamp(30px,8vw,44px); line-height:.96; letter-spacing:-.065em; margin:0; max-width:450px; } .subline { color:var(--muted); font-size:14px; margin:12px 0 25px; }
    .rings { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:28px 18px; padding:9px 2px 32px; }
    .ring-unit { text-align:center; position:relative; min-width:0; } .ring-tap { width:var(--ring-size); height:var(--ring-size); max-width:100%; background:transparent; border-radius:50%; position:relative; isolation:isolate; padding:0; transition:transform .16s ease; -webkit-tap-highlight-color:transparent; }
    .ring-tap:active { transform:scale(.94); } .ring-tap:focus-visible { outline:3px solid var(--green); outline-offset:4px; }
    .ring-svg { position:absolute; inset:0; transform:rotate(-90deg); overflow:visible; } .track { fill:none; stroke:#dce3da; stroke-width:10; } .progress { fill:none; stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset .42s cubic-bezier(.2,.8,.2,1); }
    .ring-content { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; } .count { font-size:clamp(26px,8vw,36px); font-weight:760; letter-spacing:-.07em; line-height:1; } .of { color:var(--muted); font-size:11px; margin-top:4px; font-weight:650; }.exercise { margin:10px 0 0; font-size:13px; font-weight:750; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }.plus-one { position:absolute; inset:0; display:grid; place-items:center; font-size:21px; font-weight:800; color:var(--green); opacity:0; pointer-events:none; transform:translateY(12px); }.plus-one.show { animation:plus .62s ease-out; } @keyframes plus { 0%{opacity:0;transform:translateY(14px) scale(.7)} 25%{opacity:1;transform:translateY(-3px) scale(1)} 100%{opacity:0;transform:translateY(-22px) scale(.95)} }
    .confetti { position:absolute; top:calc(var(--ring-size) / 2); left:50%; width:0; height:0; pointer-events:none; z-index:3; }.confetti i { position:absolute; width:7px; height:10px; border-radius:2px; background:var(--confetti); animation:confetti-pop .85s cubic-bezier(.15,.8,.25,1) forwards; animation-delay:var(--delay); transform:rotate(var(--spin)); } @keyframes confetti-pop { 0% { opacity:0; transform:translate(0,0) rotate(var(--spin)) scale(.4); } 14% { opacity:1; } 100% { opacity:0; transform:translate(var(--x),var(--y)) rotate(calc(var(--spin) + 260deg)) scale(.8); } }
    .undo { margin:0 auto; padding:11px 17px; border-radius:99px; background:#e7eee5; color:var(--green); display:flex; gap:8px; align-items:center; font-size:13px; font-weight:750; opacity:0; pointer-events:none; transform:translateY(8px); transition:.22s ease; } .undo.visible { opacity:1; pointer-events:auto; transform:none; } .undo b{font-size:17px; line-height:10px;}.undo small{font-size:10px;color:#668171;font-weight:800;}
    .nav { position:fixed; bottom:18px; left:50%; translate:-50% 0; width:min(calc(100% - 32px),470px); background:#20342b; border-radius:22px; padding:7px; display:grid; grid-template-columns:repeat(4,1fr); box-shadow:0 13px 28px #20342b26; z-index:5; }.nav button { padding:11px 4px 9px; background:transparent; color:#aebcb3; border-radius:16px; font-size:10px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:4px; }.nav .icon {font-size:17px; line-height:15px;}.nav button.active{background:#315342;color:white;}
    .view { display:none; }.view.active { display:block; }.section-head { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:23px; }.section-head h1 {font-size:34px;}.add { width:39px;height:39px;background:var(--lime);border-radius:50%;font-size:25px;line-height:1;box-shadow:inset 0 0 0 1px #c6ec49; }
    .history-day { border-top:1px solid var(--line); padding:17px 0; }.day-top {display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px;}.day-name{font-size:16px;font-weight:780;letter-spacing:-.03em;}.total{font-size:12px;font-weight:750;color:var(--green);background:#e2eddf;padding:5px 8px;border-radius:99px;}.breakdown{display:grid;gap:8px;}.break-row{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;}.break-row b{color:var(--ink);}
    .empty { padding:35px 12px; color:var(--muted); text-align:center; font-size:14px; }.archive-item {background:var(--white); padding:17px;border-radius:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}.archive-item small{color:var(--muted);display:block;margin-top:4px;}.archive-item b{font-size:14px;}
    .sheet { position:fixed; inset:0; background:#1733283a; display:none; align-items:flex-end; z-index:10; padding:0; }.sheet.open{display:flex;}.panel{width:min(100%,630px);margin:auto;background:var(--paper);border-radius:25px 25px 0 0;max-height:92dvh;overflow:auto;padding:23px 20px 35px;animation:up .25s ease-out;}@keyframes up{from{transform:translateY(100%)}to{transform:none}}.handle{width:38px;height:4px;background:#ccd3ca;border-radius:10px;margin:0 auto 22px;}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}.panel-head h2{margin:0;letter-spacing:-.05em;font-size:25px;}.close{background:transparent;font-size:25px;color:var(--muted);}.field{display:block;margin:13px 0;}.field span{display:block;font-size:11px;color:var(--muted);font-weight:750;text-transform:uppercase;letter-spacing:.09em;margin-bottom:7px;}.field input{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:13px;outline:none;}.date-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.exercise-fields{margin:23px 0 15px;}.exercise-edit{background:#e9eee7;border-radius:13px;padding:10px;display:grid;grid-template-columns:1fr 84px 28px;gap:7px;margin:8px 0;align-items:center;}.exercise-edit input{border:0;background:white;border-radius:8px;padding:10px;min-width:0;}.remove{background:transparent;color:#829087;font-size:20px;}.add-exercise{background:transparent;color:var(--green);font-weight:750;font-size:13px;padding:8px 0;}.save{width:100%;padding:15px;background:var(--green);color:#fff;border-radius:12px;font-weight:800;margin-top:18px;}.complete{width:100%;padding:11px;background:transparent;color:var(--muted);font-size:13px;font-weight:700;margin-top:8px;}
    @media(min-width:550px){ :root{--ring-size:178px}.app{padding-top:38px}.rings{grid-template-columns:repeat(3,1fr);gap:31px}.ring-tap{width:var(--ring-size)} }
  </style>
</head>
<body>
  <main class="app">
    <section id="sprintView" class="view active">
      <header class="topbar"><div class="brand">rep<i>/</i></div><div id="datePill" class="date-pill"></div></header>
      <p class="eyebrow">Active sprint</p><h1 id="sprintTitle">September strong</h1><p class="subline" id="sprintMeta"></p>
      <div id="rings" class="rings"></div><button id="undo" class="undo"><b>↶</b> Undo last rep</button>
    </section>
    <section id="historyView" class="view"><header class="section-head"><div><p class="eyebrow">Recorded work</p><h1>History</h1></div></header><div id="history"></div></section>
    <section id="archiveView" class="view"><header class="section-head"><div><p class="eyebrow">Your progress</p><h1>Past sprints</h1></div></header><div id="archive"></div></section>
    <nav class="nav"><button class="active" data-view="sprintView"><span class="icon">◉</span>Sprint</button><button data-view="historyView"><span class="icon">◷</span>History</button><button data-open-editor><span class="icon">＋</span>Edit</button><button data-view="archiveView"><span class="icon">□</span>Past</button></nav>
  </main>
  <div id="sheet" class="sheet"><form id="editor" class="panel"><div class="handle"></div><div class="panel-head"><h2 id="editorTitle">Edit sprint</h2><button type="button" class="close" data-close>×</button></div><label class="field"><span>Sprint title</span><input id="nameInput" required maxlength="40"></label><div class="date-fields"><label class="field"><span>Starts</span><input id="startInput" type="date" required></label><label class="field"><span>Ends</span><input id="endInput" type="date" required></label></div><div class="exercise-fields"><p class="eyebrow">Exercise goals</p><div id="exerciseInputs"></div><button type="button" id="addExercise" class="add-exercise">+ Add exercise</button></div><button class="save">Save sprint</button><button id="completeSprint" type="button" class="complete">Mark sprint complete</button></form></div>
  <script>
    const KEY='rep-sprint-data-v1';
    const seed={active:{id:'s1',name:'September strong',startsAt:'2026-09-01',endsAt:'2026-09-30',status:'active',exercises:[{id:'e1',exerciseName:'Push-ups',targetReps:100,completedReps:69},{id:'e2',exerciseName:'Air squats',targetReps:200,completedReps:122},{id:'e3',exerciseName:'Sit-ups',targetReps:100,completedReps:44},{id:'e4',exerciseName:'Lunges',targetReps:120,completedReps:78}],entries:[]},past:[]};
    const stored=localStorage.getItem(KEY);
    if(!stored) seed.active.exercises.forEach((ex, exerciseIndex)=>{ for(let n=0;n<ex.completedReps;n++) seed.active.entries.push({id:crypto.randomUUID(),sprintId:seed.active.id,sprintExerciseId:ex.id,quantity:1,recordedAt:new Date(Date.now()-(n%3)*86400000-exerciseIndex*3600000).toISOString()}) });
    let data=JSON.parse(stored||JSON.stringify(seed)), undoStack=[];
    // Migrate earlier saved demos, which had visible totals but no RepEntry history.
    // This keeps the rings and history internally consistent after the colour update.
    if(data.active){let repaired=false;data.active.exercises.forEach((ex,exerciseIndex)=>{const logged=data.active.entries.filter(e=>e.sprintExerciseId===ex.id).reduce((sum,e)=>sum+e.quantity,0);for(let n=logged;n<ex.completedReps;n++){data.active.entries.push({id:crypto.randomUUID(),sprintId:data.active.id,sprintExerciseId:ex.id,quantity:1,recordedAt:new Date(Date.now()-((n+exerciseIndex)%4)*86400000).toISOString()});repaired=true}});if(repaired)localStorage.setItem(KEY,JSON.stringify(data))}
    const $=s=>document.querySelector(s), dateFmt=new Intl.DateTimeFormat('en',{month:'short',day:'numeric'});
    const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
    function active(){return data.active} function dates(s){return `${dateFmt.format(new Date(s.startsAt+'T12:00'))} — ${dateFmt.format(new Date(s.endsAt+'T12:00'))}`}
    const exercisePalettes=[['#23785a','#4fad7d','#93cf9f','#d5e99c'],['#3f6fb3','#669bd6','#96c6e7','#bddded'],['#b45a3f','#dc8660','#f2b679','#f5d5a4'],['#754c9a','#9a70bd','#c69bd8','#ead0e8'],['#9b6c1e','#d19c35','#eacb62','#f2e5a5']];
    function ringSegments(s,ex,index,circumference){const byDay={};s.entries.filter(e=>e.sprintExerciseId===ex.id).forEach(e=>{const d=e.recordedAt.slice(0,10);byDay[d]=(byDay[d]||0)+e.quantity});let cursor=0,palette=exercisePalettes[index%exercisePalettes.length];return Object.entries(byDay).sort(([a],[b])=>a.localeCompare(b)).map(([day,quantity],i)=>{const length=Math.min(quantity/ex.targetReps*circumference,Math.max(0,circumference-cursor));const node=`<circle class="progress" cx="55" cy="55" r="45" stroke="${palette[i%palette.length]}" style="stroke-dasharray:${length} ${circumference-length};stroke-dashoffset:${-cursor}"><title>${day}: ${quantity} reps</title></circle>`;cursor+=length;return node}).join('')}
    function updateUndo(){const b=$('#undo'),count=undoStack.length;b.innerHTML=`<b>↶</b> Undo recent rep ${count?`<small>${count} available</small>`:''}`;b.classList.toggle('visible',count>0)}
    function renderSprint(){ const s=active(); $('#sprintTitle').textContent=s?.name||'No active sprint'; $('#datePill').textContent=s?dates(s):''; $('#sprintMeta').textContent=s?`${s.exercises.length} goals · tap a ring to log a rep`: 'Create a sprint to begin'; const root=$('#rings'); root.innerHTML=''; if(!s){root.innerHTML='<div class="empty">Your next small win starts here.</div>';updateUndo();return} s.exercises.forEach((ex,index)=>{const radius=45, circumference=2*Math.PI*radius, palette=exercisePalettes[index%exercisePalettes.length]; const el=document.createElement('div');el.className='ring-unit';el.innerHTML=`<button class="ring-tap" aria-label="Add one ${ex.exerciseName} rep"><svg class="ring-svg" viewBox="0 0 110 110"><circle class="track" cx="55" cy="55" r="${radius}"/>${ringSegments(s,ex,index,circumference)}</svg><span class="ring-content"><strong class="count" style="color:${palette[0]}">${ex.completedReps}</strong><span class="of">of ${ex.targetReps}</span></span><span class="plus-one" style="color:${palette[0]}">+1</span></button><p class="exercise">${ex.exerciseName}</p>`; el.querySelector('button').onclick=()=>tap(ex.id);root.append(el)});updateUndo();}
    function celebrateRing(unit,palette){const burst=document.createElement('span');burst.className='confetti';burst.setAttribute('aria-hidden','true');for(let i=0;i<18;i++){const angle=(Math.PI*2*i/18)+Math.random()*.2, distance=42+Math.random()*46, piece=document.createElement('i');piece.style.cssText=`--x:${Math.cos(angle)*distance}px;--y:${Math.sin(angle)*distance}px;--spin:${Math.round(Math.random()*170)}deg;--delay:${Math.round(Math.random()*90)}ms;--confetti:${palette[i%palette.length]}`;burst.append(piece)}unit.append(burst);setTimeout(()=>burst.remove(),1100)}
    function tap(id){const s=active(), ex=s.exercises.find(x=>x.id===id), wasComplete=ex.completedReps>=ex.targetReps;ex.completedReps++;const entry={id:crypto.randomUUID(),sprintId:s.id,sprintExerciseId:id,quantity:1,recordedAt:new Date().toISOString()};s.entries.push(entry);undoStack.push(entry.id); save(); if(navigator.vibrate)navigator.vibrate(12); renderSprint(); const same=[...$('#rings').children].find(n=>n.querySelector('.exercise').textContent===ex.exerciseName);same?.querySelector('.plus-one').classList.add('show');if(!wasComplete&&ex.completedReps>=ex.targetReps){const index=s.exercises.findIndex(x=>x.id===id);celebrateRing(same,exercisePalettes[index%exercisePalettes.length])}}
    $('#undo').onclick=()=>{const id=undoStack.pop();if(!id)return;const s=active(),idx=s.entries.findIndex(x=>x.id===id);if(idx>=0){const e=s.entries[idx],ex=s.exercises.find(x=>x.id===e.sprintExerciseId);ex.completedReps=Math.max(0,ex.completedReps-1);s.entries.splice(idx,1);save()}renderSprint();};
    function renderHistory(){const s=active();if(!s?.entries.length){$('#history').innerHTML='<div class="empty">Reps you log will show up here, grouped by day.</div>';return}const groups={};s.entries.forEach(e=>{const day=e.recordedAt.slice(0,10);(groups[day]??=[]).push(e)});$('#history').innerHTML=Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0])).map(([day,es])=>{const by={};es.forEach(e=>{const n=s.exercises.find(x=>x.id===e.sprintExerciseId)?.exerciseName||'Exercise';by[n]=(by[n]||0)+e.quantity});return `<article class="history-day"><div class="day-top"><span class="day-name">${day===new Date().toISOString().slice(0,10)?'Today':dateFmt.format(new Date(day+'T12:00'))}</span><span class="total">${es.length} reps</span></div><div class="breakdown">${Object.entries(by).map(([n,q])=>`<div class="break-row"><span>${n}</span><b>+${q}</b></div>`).join('')}</div></article>`}).join('')}
    function renderArchive(){ $('#archive').innerHTML=data.past.length?data.past.map(s=>`<article class="archive-item"><div><b>${s.name}</b><small>${dates(s)} · ${s.exercises.reduce((a,x)=>a+x.completedReps,0)} reps</small></div><span>✓</span></article>`).join(''):'<div class="empty">Completed sprints will live here.</div>' }
    function showEditor(){const s=active()||{name:'',startsAt:new Date().toISOString().slice(0,10),endsAt:'',exercises:[]};$('#nameInput').value=s.name;$('#startInput').value=s.startsAt;$('#endInput').value=s.endsAt;$('#completeSprint').style.display=active()?'block':'none';renderInputs(s.exercises);$('#sheet').classList.add('open')}
    function renderInputs(exercises){const root=$('#exerciseInputs');root.innerHTML='';(exercises.length?exercises:[{exerciseName:'',targetReps:''}]).forEach(ex=>addInput(ex));} function addInput(ex={exerciseName:'',targetReps:''}){const d=document.createElement('div');d.className='exercise-edit';d.innerHTML=`<input class="ex-name" placeholder="Exercise name" value="${ex.exerciseName}"><input class="ex-target" type="number" min="1" placeholder="Reps" value="${ex.targetReps}"><button type="button" class="remove">×</button>`;d.querySelector('.remove').onclick=()=>d.remove();$('#exerciseInputs').append(d)} $('#addExercise').onclick=()=>addInput();
    $('#editor').onsubmit=e=>{e.preventDefault();const old=active(), exercises=[...document.querySelectorAll('.exercise-edit')].map(r=>({id:crypto.randomUUID(),exerciseName:r.querySelector('.ex-name').value.trim(),targetReps:+r.querySelector('.ex-target').value,completedReps:0})).filter(x=>x.exerciseName&&x.targetReps);if(!exercises.length)return;data.active={id:old?.id||crypto.randomUUID(),name:$('#nameInput').value.trim(),startsAt:$('#startInput').value,endsAt:$('#endInput').value,status:'active',exercises:old?exercises.map(x=>{const prior=old.exercises.find(o=>o.exerciseName===x.exerciseName);return {...x,id:prior?.id||x.id,completedReps:prior?.completedReps||0}}):exercises,entries:old?.entries||[]};save();close();renderSprint();};
    $('#completeSprint').onclick=()=>{if(!active())return;data.active.status='completed';data.past.unshift(data.active);data.active=null;undoStack=[];save();close();renderSprint();renderArchive();};function close(){$('#sheet').classList.remove('open')} $('[data-close]').onclick=close;$('[data-open-editor]').onclick=showEditor;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));$('#'+b.dataset.view).classList.add('active');b.classList.add('active');if(b.dataset.view==='historyView')renderHistory();if(b.dataset.view==='archiveView')renderArchive();});renderSprint();
  </script>
</body>
</html>
